name: Sync pnpm Docker Image with Latest Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      pnpm_version:
        description: 'Override pnpm version (e.g. 10.32.1). Leave empty to use latest.'
        required: false
        default: ''
      force_build:
        description: 'Force a rebuild even if the image tag already exists.'
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-pnpm
  cancel-in-progress: true

jobs:
  get-pnpm-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PNPM_VERSION: ${{ inputs.pnpm_version }}
      FORCE_BUILD: ${{ inputs.force_build == true }}
    outputs:
      pnpm_version: ${{ steps.get_tag.outputs.pnpm_version }}
      pnpm_major_version: ${{ steps.get_tag.outputs.pnpm_major_version }}
      should_build: ${{ steps.check.outputs.should_build }}
      node_versions: ${{ steps.node.outputs.node_versions }}
      latest_node: ${{ steps.node.outputs.latest_node }}
    steps:
      - name: Get latest pnpm release tag (without leading v)
        id: get_tag
        run: |
          if [ -n "$PNPM_VERSION" ]; then
            tag="$PNPM_VERSION"
          else
            tag=$(curl -s https://api.github.com/repos/pnpm/pnpm/releases/latest | jq -r '.tag_name')
            tag="${tag#v}"
          fi
          echo "pnpm_version=$tag" >> $GITHUB_OUTPUT
          echo "pnpm_major_version=$(echo "$tag" | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Get non-EOL Node.js versions
        id: node
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          versions=$(curl -fsS https://endoflife.date/api/nodejs.json | jq -c --arg today "$today" \
            '[.[] | select(.eol == false or .eol > $today) | .cycle] | sort_by(tonumber)')
          echo "node_versions=$versions" >> "$GITHUB_OUTPUT"
          echo "latest_node=$(echo "$versions" | jq -r 'last')" >> "$GITHUB_OUTPUT"

      - name: Check if any image is missing on GHCR
        id: check
        run: |
          set -euo pipefail

          if [ "$FORCE_BUILD" = 'true' ]; then
            echo 'Force build requested; skipping existing image check.'
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm_version='${{ steps.get_tag.outputs.pnpm_version }}'
          token=$(curl -s "https://ghcr.io/token?scope=repository:yorukai/pnpm:pull" | jq -r '.token')
          should_build='false'

          for node in $(echo '${{ steps.node.outputs.node_versions }}' | jq -r '.[]'); do
            for suffix in '' '-alpine'; do
              tag="$pnpm_version-node$node$suffix"
              status_code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/yorukai/pnpm/manifests/$tag")
              if [ "$status_code" != '200' ]; then
                echo "Missing image tag: $tag"
                should_build='true'
              fi
            done
          done

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-pnpm:
    needs: get-pnpm-version
    if: needs.get-pnpm-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/yorukai/pnpm
      IMAGE_MAINTAINER: Dennis Rumpf <33402703+yorukai@users.noreply.github.com>
      LATEST_NODE: ${{ needs.get-pnpm-version.outputs.latest_node }}
    strategy:
      fail-fast: false
      matrix:
        node_version: ${{ fromJSON(needs.get-pnpm-version.outputs.node_versions) }}
        variant: [debian, alpine]
        include:
          - variant: debian
            suffix: ''
          - variant: alpine
            suffix: '-alpine'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.authors=${{ env.IMAGE_MAINTAINER }}
            org.opencontainers.image.description=Node.js ${{ matrix.node_version }} ${{ matrix.variant }} image with pnpm ${{ needs.get-pnpm-version.outputs.pnpm_version }}
          tags: |
            type=raw,value=${{ needs.get-pnpm-version.outputs.pnpm_version }}-node${{ matrix.node_version }}${{ matrix.suffix }}
            type=raw,value=${{ needs.get-pnpm-version.outputs.pnpm_major_version }}-node${{ matrix.node_version }}${{ matrix.suffix }}
            type=raw,value=node${{ matrix.node_version }}${{ matrix.suffix }}
            type=raw,value=${{ needs.get-pnpm-version.outputs.pnpm_version }}${{ matrix.suffix }},enable=${{ matrix.node_version == env.LATEST_NODE }}
            type=raw,value=${{ needs.get-pnpm-version.outputs.pnpm_major_version }}${{ matrix.suffix }},enable=${{ matrix.node_version == env.LATEST_NODE }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ matrix.node_version == env.LATEST_NODE }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Attestations make an index whose child manifests are untagged; cleanup would delete them
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PNPM_VERSION=${{ needs.get-pnpm-version.outputs.pnpm_version }}
            NODE_VERSION=${{ matrix.node_version }}
            NODE_SUFFIX=${{ matrix.suffix }}

  cleanup-untagged-images:
    needs: [build-pnpm, get-pnpm-version]
    if: needs.get-pnpm-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete untagged GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: pnpm
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    needs: [build-pnpm, get-pnpm-version]
    if: needs.get-pnpm-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate README Node.js table
        run: scripts/update-readme.py '${{ needs.get-pnpm-version.outputs.pnpm_version }}'

      - name: Commit README
        run: |
          if git diff --quiet README.md; then
            echo 'README unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update README for pnpm ${{ needs.get-pnpm-version.outputs.pnpm_version }}'
          git push
